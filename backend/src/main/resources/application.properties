spring.application.name=agendamento-api

# Lê o arquivo .env (se existir) na pasta do backend. Ele NÃO vai para o GitHub.
spring.config.import=optional:file:.env[.properties]

# A Render define a variável PORT. Localmente usa 8080.
server.port=${PORT:8080}

# Endereços do frontend autorizados a chamar a API (separados por vírgula).
app.cors.origens=${CORS_ORIGENS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}

# --- Banco de dados (PostgreSQL) ---
# A senha NÃO tem valor padrão de propósito: ela vem do .env ou de variável de ambiente.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agendamento}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# "update" cria/ajusta as tabelas sozinho (bom para desenvolver).
# Em produção, o ideal é migrações (Flyway) e "validate" - podemos fazer isso depois.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# --- Segurança (login da profissional) ---
# JWT_SECRET: texto longo e aleatório (mínimo 32 caracteres). Fica só no .env / variáveis do servidor.
app.jwt.segredo=${JWT_SECRET:}
app.jwt.expiracao-horas=${JWT_EXPIRACAO_HORAS:8}
# Conta criada automaticamente na primeira execução (se ainda não existir).
app.admin.nome=${ADMIN_NOME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_SENHA:}
